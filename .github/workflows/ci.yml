name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build_and_test:
    runs-on: windows-latest

    env:
      YMM4_PATH: ${{ github.workspace }}\libs\YMM4

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch YMM4 Build Libraries
        shell: pwsh
        run: ./scripts/fetch-ymm4-libs.ps1 -OutputDir "libs/YMM4"

      - name: Restore
        run: dotnet restore .\YMMResourceUnpackerApp.sln

      - name: Build
        run: dotnet build .\YMMResourceUnpackerApp.sln -c Release --no-restore

      - name: Test
        run: dotnet test .\YMMResourceUnpackerApp.sln -c Release --no-build
